<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B站深度阅读助手 · 界面预览</title>
  <link rel="stylesheet" href="sidepanel.css">
  <style>
    html, body { height: 100%; }
    body.preview {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      padding: 24px;
    }
    .device {
      width: 400px;
      height: 720px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      border: 1px solid #2c333d;
      background: #14171c;
      position: relative;
    }
    .preview-badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(251,114,153,0.92);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      z-index: 20;
      pointer-events: none;
    }
    .device main { max-height: calc(720px - 50px); }
    /* 覆盖隐藏 main 空状态等不需要的元素 */
    .video-thumb { background: #2c333d; }
  </style>
</head>
<body class="preview">
  <div class="device">
    <div class="preview-badge">UI 预览 · 示例数据</div>

    <header class="app-header">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M8 5.5 12 2l4 3.5h-2.5V7h-3V5.5H8Zm-3.5 3A2.5 2.5 0 0 0 2 11v6a2.5 2.5 0 0 0 2.5 2.5H6l1.5 2 1.5-2h6l1.5 2 1.5-2h1.5a2.5 2.5 0 0 0 2.5-2.5v-6a2.5 2.5 0 0 0-2.5-2.5h-13Zm0 2h13a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-.5.5H4.5a.5.5 0 0 1-.5-.5v-6a.5.5 0 0 1 .5-.5ZM6.75 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm10.5 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
          </svg>
        </span>
        <span class="brand-text">B站深度阅读</span>
      </div>
      <button class="icon-btn" aria-label="设置">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm-8.9 1a8.9 8.9 0 0 1 .15-1.5L1.4 8.2l2-3.4 2.1.9a8.8 8.8 0 0 1 2.6-1.5L8.6 2h4l.5 2.2c.96.32 1.8.83 2.6 1.5l2.1-.9 2 3.4-1.85 1.5c.1.5.15 1 .15 1.5s-.05 1-.15 1.5l1.85 1.5-2 3.4-2.1-.9a8.8 8.8 0 0 1-2.6 1.5L12.6 22h-4l-.5-2.2a8.8 8.8 0 0 1-2.6-1.5l-2.1.9-2-3.4 1.85-1.5A8.9 8.9 0 0 1 3.1 11Z"/>
        </svg>
      </button>
    </header>

    <main>
      <section id="video-view">
        <div class="video-card">
          <img class="video-thumb" src="https://i0.hdslb.com/bfs/archive/demo-thumb.jpg" alt="">
          <div class="video-meta">
            <h2 class="video-title">AI 产品经理转型指南：从需求文档到 Agent 设计</h2>
            <div class="video-sub">
              <span class="video-up">UP 主：产品圆桌派</span>
              <span class="chip">AI 字幕 · 中文</span>
            </div>
          </div>
        </div>

        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="overview" role="tab">概览</button>
          <button class="tab" data-tab="transcript" role="tab">文稿</button>
          <button class="tab" data-tab="notes" role="tab">笔记 <span id="note-count" class="badge">2</span></button>
        </nav>

        <div id="tab-overview" class="tab-panel active" role="tabpanel"></div>
        <div id="tab-transcript" class="tab-panel" role="tabpanel"></div>
        <div id="tab-notes" class="tab-panel" role="tabpanel"></div>
      </section>
    </main>
  </div>

  <script src="preview.js"></script>
</body>
</html>
